<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7a3f26"><title>Sapataria Pro</title><style>
:root{--bg:#f6f2ec;--card:#fff;--text:#2e241e;--muted:#766b61;--brand:#7a3f26;--brand2:#9b5b38;--gold:#e5a14c;--line:#e9dfd4;--ok:#2e7d5b;--danger:#b43c3c;--shadow:0 12px 35px #3b291b12}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.hero{background:linear-gradient(145deg,#38261e,#6f3a25);color:#fff;padding:7vw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:#e5a14c20;right:-220px;top:-180px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.logo{width:46px;height:46px;border-radius:15px;background:var(--gold);display:grid;place-items:center;color:#3b281e;font-size:23px}.hero h2{font-size:clamp(40px,5vw,68px);line-height:1.02;margin:20px 0}.hero p{color:#ffffffb8;max-width:560px;line-height:1.7}.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.features span{font-size:14px;color:#fffC}.loginbox{display:grid;place-items:center;padding:30px}.panel{width:min(450px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)}h1{margin:0 0 8px;font-size:32px}.sub{color:var(--muted);font-size:14px;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f4efe9;border-radius:12px;padding:4px;margin:24px 0}.tabs button{border:0;background:transparent;padding:11px;border-radius:9px}.tabs .active{background:#fff;box-shadow:0 2px 8px #0000000d}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd1c4;border-radius:12px;padding:12px 13px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px #9b5b3820}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:var(--brand);color:#fff}.secondary{background:#f2ece6;color:var(--text)}.danger{background:#fdeaea;color:var(--danger)}.link{border:0;background:none;color:var(--brand);font-weight:700;padding:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#2f231d;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:5}.sidebrand{padding:8px 10px 24px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#ffffffb5;border:0;text-align:left;padding:12px;border-radius:11px}.nav button.active,.nav button:hover{background:#ffffff10;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top h2{margin:0}.userpill{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:99px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 5px 18px #3b291b08}.metric{font-size:27px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:13px;border-bottom:1px solid #eee5dc;text-align:left;font-size:13px}.table th{background:#faf7f3;font-size:12px;color:var(--muted)}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#f1ece6}.badge.ok{background:#e8f5ee;color:var(--ok)}.badge.warn{background:#fff2d8;color:#9a6a12}.badge.danger{background:#fdeaea;color:var(--danger)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{background:#fff;border-radius:20px;padding:24px;width:min(620px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:20px;bottom:20px;background:#2f231d;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:30}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.sidebar{width:70px;padding:12px 8px}.sidebrand .label,.nav .label{display:none}.sidebrand{padding:8px 5px 20px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}.panel{padding:23px}.main{padding:12px}.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div id="root"></div><script>
const KEY='sapataria_pro_data_v1',AUTH='sapataria_pro_auth';
const seed={customers:[],services:[],products:[{id:1,name:'Palmilha conforto',category:'Acessórios',brand:'Sapataria Pro',size:'Único',color:'Preto',code:'PAL001',cost:8,sale:20,stock:12}],sales:[],cash:{opening:0,movements:[],closed:false},settings:{shop:'Sapataria Pro',phone:'(00) 00000-0000',address:'Endereço da loja'}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed; function save(){localStorage.setItem(KEY,JSON.stringify(db))} function id(){return Date.now()+Math.random()} function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}
function login(){document.getElementById('root').innerHTML=`<div class="login"><section class="hero"><div class="brand"><span class="logo">👞</span>Sapataria Pro</div><div><span class="badge">✓ Acesso seguro</span><h2>Do sapato na bancada ao caixa fechado.</h2><p>Clientes, ordens de serviço, produtos, vendas, estoque e fechamento diário em um só lugar.</p><div class="features"><span>✓ Ordens e histórico</span><span>✓ Estoque automático</span><span>✓ Caixa diário</span><span>✓ Relatórios</span></div></div><small style="color:#ffffff66">Gestão simples para sua sapataria</small></section><section class="loginbox"><div class="panel"><div class="brand" style="color:var(--text);margin-bottom:22px"><span class="logo">👞</span>Sapataria Pro</div><h1>Acesse o sistema</h1><div class="sub">Entre com sua conta para gerenciar a sapataria.</div><div class="tabs"><button id="tabIn" class="active" onclick="showTab('in')">Entrar</button><button id="tabUp" onclick="showTab('up')">Criar conta</button></div><div id="authform"></div></div></section></div>`;showTab('in')}
function showTab(t){tabIn.classList.toggle('active',t==='in');tabUp.classList.toggle('active',t==='up');authform.innerHTML=t==='in'?`<form onsubmit="doLogin(event)"><div class="field"><label>E-mail</label><input id="email" type="email" required placeholder="voce@sapataria.com"></div><div class="field"><label>Senha</label><input id="pass" type="password" required minlength="6" placeholder="••••••••"></div><div style="display:flex;justify-content:flex-end;margin:4px 0 16px"><button class="link" type="button" onclick="forgot()">Esqueci minha senha</button></div><button class="btn primary" style="width:100%">Entrar</button><p class="muted" style="margin-top:15px;text-align:center">Demo: <b>admin@sapataria.com</b> / <b>123456</b></p></form>`:`<form onsubmit="doSignup(event)"><div class="field"><label>Nome</label><input id="name" required placeholder="Seu nome"></div><div class="field"><label>E-mail</label><input id="email" type="email" required placeholder="voce@sapataria.com"></div><div class="field"><label>Senha</label><input id="pass" type="password" required minlength="6" placeholder="Mínimo 6 caracteres"></div><button class="btn primary" style="width:100%">Criar conta</button></form>`}
function doLogin(e){e.preventDefault();let email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('pass').value;if((email==='admin@sapataria.com'&&pass==='123456')||JSON.parse(localStorage.getItem('sapataria_users')||'[]').some(u=>u.email===email&&u.pass===pass)){localStorage.setItem(AUTH,JSON.stringify({email}));app();toast('Login realizado com sucesso!')}else toast('E-mail ou senha inválidos. Use o acesso demo.')}
function doSignup(e){e.preventDefault();let name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('pass').value,users=JSON.parse(localStorage.getItem('sapataria_users')||'[]');if(users.some(u=>u.email===email)){toast('Este e-mail já está cadastrado.');return}users.push({name,email,pass});localStorage.setItem('sapataria_users',JSON.stringify(users));localStorage.setItem(AUTH,JSON.stringify({email,name}));app();toast('Conta criada!')}
function forgot(){let e=prompt('Digite seu e-mail para recuperação:');if(e)toast('Em uma versão com servidor, o link seria enviado para '+e)}
const nav=[['dashboard','🏠','Dashboard'],['clientes','👥','Clientes'],['servicos','🛠️','Ordens de serviço'],['produtos','📦','Produtos'],['vendas','🛒','Vendas / PDV'],['caixa','💰','Caixa'],['relatorios','📊','Relatórios'],['config','⚙️','Configurações']];let page='dashboard';
function app(){let a=JSON.parse(localStorage.getItem(AUTH)||'null');if(!a){login();return}document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="sidebrand brand"><span class="logo">👞</span><span class="label">Sapataria Pro</span></div><nav class="nav">${nav.map(n=>`<button onclick="go('${n[0]}')" id="nav-${n[0]}"><span>${n[1]}</span> <span class="label">${n[2]}</span></button>`).join('')}<button onclick="logout()" style="margin-top:15px">🚪 <span class="label">Sair</span></button></nav></aside><main class="main"><div class="top"><div><h2 id="title">Dashboard</h2><div class="muted">Visão geral da sua sapataria</div></div><div class="userpill">👤 ${esc(a.name||a.email)}</div></div><div id="content"></div></main></div>`;go('dashboard')}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let n=document.getElementById('nav-'+p);if(n)n.classList.add('active');let names=Object.fromEntries(nav.map(x=>[x[0],x[2]]));title.textContent=names[p]||'Sapataria Pro';({dashboard:dashboard,clientes:clientes,servicos:servicos,produtos:produtos,vendas:vendas,caixa:caixa,relatorios:relatorios,config:config})[p]()}
function dashboard(){let today=new Date().toISOString().slice(0,10),sv=db.services.filter(x=>x.date?.slice(0,10)===today),sa=db.sales.filter(x=>x.date?.slice(0,10)===today),received=sv.reduce((a,x)=>a+Number(x.paid||0),0)+sa.reduce((a,x)=>a+Number(x.total||0),0),pending=db.services.filter(x=>!['Entregue','Cancelado'].includes(x.status)).length;content.innerHTML=`<div class="cards"><div class="card"><div class="muted">Vendas hoje</div><div class="metric">${money(sa.reduce((a,x)=>a+Number(x.total||0),0))}</div></div><div class="card"><div class="muted">Serviços hoje</div><div class="metric">${sv.length}</div></div><div class="card"><div class="muted">Pendentes</div><div class="metric">${pending}</div></div><div class="card"><div class="muted">Recebido hoje</div><div class="metric">${money(received)}</div></div></div><div class="grid2 section"><div class="card"><div class="sectionhead"><b>Ordens recentes</b><button class="btn secondary" onclick="go('servicos')">Ver todas</button></div>${db.services.slice(-5).reverse().map(serviceRow).join('')||'<div class="empty">Nenhuma ordem cadastrada.</div>'}</div><div class="card"><div class="sectionhead"><b>Estoque baixo</b><button class="btn secondary" onclick="go('produtos')">Gerenciar</button></div>${db.products.filter(p=>p.stock<=3).map(p=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee5dc"><span>${esc(p.name)}</span><span class="badge danger">${p.stock} un.</span></div>`).join('')||'<div class="empty">Estoque em dia.</div>'}</div></div>`}
function serviceRow(x){return `<div style="padding:11px 0;border-bottom:1px solid #eee5dc"><div style="display:flex;justify-content:space-between"><b>OS #${String(x.id).slice(-5)}</b><span class="badge ${x.status==='Pronto'?'ok':''}">${esc(x.status)}</span></div><div class="muted">${esc(x.customer)} · ${esc(x.shoe||'Serviço')} · ${money(x.price||0)}</div></div>`}
function clientes(){content.innerHTML=`<div class="toolbar"><input id="searchC" placeholder="Buscar por nome ou telefone" oninput="renderClientes()"><button class="btn primary" onclick="modalCliente()">+ Novo cliente</button></div><div id="clientesTable" class="section"></div>`;renderClientes()}
function renderClientes(){let q=(document.getElementById('searchC')?.value||'').toLowerCase();let arr=db.customers.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(q));clientesTable.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>WhatsApp</th><th>Endereço</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.whats||'')}</td><td>${esc(x.address||'')}</td><td><button class="btn danger" onclick="delCliente(${x.id})">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum cliente encontrado.</td></tr>'}</tbody></table></div>`}
function modalCliente(){modal('Novo cliente',`<div class="formgrid"><div class="field"><label>Nome</label><input id="f1" required></div><div class="field"><label>Telefone</label><input id="f2"></div><div class="field"><label>WhatsApp</label><input id="f3"></div><div class="field"><label>CPF (opcional)</label><input id="f4"></div><div class="field full"><label>Endereço</label><input id="f5"></div><div class="field full"><label>Observações</label><textarea id="f6"></textarea></div></div>`,()=>{db.customers.push({id:id(),name:f1.value,phone:f2.value,whats:f3.value,cpf:f4.value,address:f5.value,notes:f6.value});save();closeModal();renderClientes();toast('Cliente cadastrado!')})}
function delCliente(i){if(confirm('Excluir este cliente?')){db.customers=db.customers.filter(x=>x.id!=i);save();renderClientes()}}
function servicos(){content.innerHTML=`<div class="toolbar"><input id="searchS" placeholder="Buscar cliente ou OS" oninput="renderServicos()"><select id="filterS" onchange="renderServicos()"><option>Todos</option><option>Aguardando avaliação</option><option>Em reparo</option><option>Pronto</option><option>Entregue</option><option>Cancelado</option></select><button class="btn primary" onclick="modalServico()">+ Nova ordem</button></div><div id="servTable" class="section"></div>`;renderServicos()}
function renderServicos(){let q=(searchS?.value||'').toLowerCase(),f=filterS?.value||'Todos',arr=db.services.filter(x=>(x.customer+' '+x.id).toLowerCase().includes(q)&&(f==='Todos'||x.status===f));servTable.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>OS</th><th>Cliente</th><th>Sapato</th><th>Serviço</th><th>Preço</th><th>Status</th></tr></thead><tbody>${arr.map(x=>`<tr><td>#${String(x.id).slice(-5)}</td><td>${esc(x.customer)}</td><td>${esc(x.shoe)}</td><td>${esc(x.work)}</td><td>${money(x.price)}</td><td><select onchange="statusService(${x.id},this.value)">${['Aguardando avaliação','Em reparo','Pronto','Entregue','Cancelado'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma ordem encontrada.</td></tr>'}</tbody></table></div>`}
function statusService(i,s){let x=db.services.find(x=>x.id==i);if(x){x.status=s;save();toast('Status atualizado.')}}
function modalServico(){let opts=db.customers.map(c=>`<option>${esc(c.name)}</option>`).join('');modal('Nova ordem de serviço',`<div class="formgrid"><div class="field"><label>Cliente</label><select id="f1">${opts||'<option>Cliente não cadastrado</option>'}</select></div><div class="field"><label>Telefone</label><input id="f2"></div><div class="field"><label>Tipo de calçado</label><input id="f3" placeholder="Tênis, sapato, bota..."></div><div class="field"><label>Marca / cor / tamanho</label><input id="f4"></div><div class="field"><label>Problema</label><input id="f5"></div><div class="field"><label>Serviço solicitado</label><input id="f6"></div><div class="field"><label>Preço</label><input id="f7" type="number" step="0.01"></div><div class="field"><label>Valor pago</label><input id="f8" type="number" step="0.01"></div><div class="field full"><label>Observações</label><textarea id="f9"></textarea></div></div>`,()=>{let paid=+f8.value||0;db.services.push({id:id(),customer:f1.value,phone:f2.value,shoe:f3.value,details:f4.value,problem:f5.value,work:f6.value,price:+f7.value||0,paid,date:new Date().toISOString(),status:'Aguardando avaliação',notes:f9.value});if(paid)db.cash.movements.push({id:id(),type:'entrada',desc:'Pagamento OS',value:paid,date:new Date().toISOString()});save();closeModal();renderServicos();toast('Ordem criada!')})}
function produtos(){content.innerHTML=`<div class="toolbar"><input id="searchP" placeholder="Buscar produto" oninput="renderProdutos()"><button class="btn primary" onclick="modalProduto()">+ Novo produto</button></div><div id="prodTable" class="section"></div>`;renderProdutos()}
function renderProdutos(){let q=(searchP?.value||'').toLowerCase(),arr=db.products.filter(x=>(x.name+' '+x.code+' '+x.brand).toLowerCase().includes(q));prodTable.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Código</th><th>Categoria</th><th>Venda</th><th>Estoque</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.brand)} ${esc(x.color)}</div></td><td>${esc(x.code)}</td><td>${esc(x.category)}</td><td>${money(x.sale)}</td><td><span class="badge ${x.stock<=3?'danger':'ok'}">${x.stock}</span></td><td><button class="btn secondary" onclick="sellOne(${x.id})">Vender 1</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum produto.</td></tr>'}</tbody></table></div>`}
function sellOne(i){let p=db.products.find(x=>x.id==i);if(!p||p.stock<1)return toast('Produto sem estoque.');p.stock--;db.sales.push({id:id(),date:new Date().toISOString(),items:[{productId:p.id,name:p.name,qty:1,price:p.sale}],total:p.sale,payment:'Dinheiro'});db.cash.movements.push({id:id(),type:'entrada',desc:'Venda: '+p.name,value:p.sale,date:new Date().toISOString()});save();renderProdutos();toast('Venda registrada e estoque atualizado!')}
function modalProduto(){modal('Novo produto',`<div class="formgrid"><div class="field"><label>Nome</label><input id="f1"></div><div class="field"><label>Categoria</label><input id="f2"></div><div class="field"><label>Marca</label><input id="f3"></div><div class="field"><label>Tamanho</label><input id="f4"></div><div class="field"><label>Cor</label><input id="f5"></div><div class="field"><label>Código</label><input id="f6"></div><div class="field"><label>Custo</label><input id="f7" type="number" step="0.01"></div><div class="field"><label>Preço de venda</label><input id="f8" type="number" step="0.01"></div><div class="field"><label>Estoque</label><input id="f9" type="number"></div><div class="field full"><label>Descrição</label><textarea id="f10"></textarea></div></div>`,()=>{db.products.push({id:id(),name:f1.value,category:f2.value,brand:f3.value,size:f4.value,color:f5.value,code:f6.value,cost:+f7.value||0,sale:+f8.value||0,stock:+f9.value||0,description:f10.value});save();closeModal();renderProdutos();toast('Produto cadastrado!')})}
function vendas(){content.innerHTML=`<div class="grid2"><div class="card"><b>Venda rápida</b><div class="field"><label>Produto</label><select id="saleProd">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.sale)} (${p.stock} un.)</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="saleQty" type="number" min="1" value="1"></div><div class="field"><label>Pagamento</label><select id="salePay"><option>Dinheiro</option><option>PIX</option><option>Cartão</option></select></div><button class="btn primary" onclick="finishSale()">Finalizar venda</button></div><div class="card"><b>Últimas vendas</b>${db.sales.slice(-7).reverse().map(s=>`<div style="padding:12px 0;border-bottom:1px solid #eee5dc;display:flex;justify-content:space-between"><span>${new Date(s.date).toLocaleString('pt-BR')}<div class="muted">${s.items.map(i=>esc(i.name)).join(', ')}</div></span><b>${money(s.total)}</b></div>`).join('')||'<div class="empty">Nenhuma venda.</div>'}</div></div>`}
function finishSale(){let p=db.products.find(x=>x.id==saleProd.value),q=+saleQty.value||1;if(!p)return;if(p.stock<q)return toast('Estoque insuficiente.');p.stock-=q;let total=p.sale*q;db.sales.push({id:id(),date:new Date().toISOString(),items:[{productId:p.id,name:p.name,qty:q,price:p.sale}],total,payment:salePay.value});db.cash.movements.push({id:id(),type:'entrada',desc:'Venda: '+p.name,value:total,date:new Date().toISOString()});save();go('vendas');toast('Venda finalizada!')}
function caixa(){let entradas=db.cash.movements.filter(x=>x.type==='entrada').reduce((a,x)=>a+x.value,0),saidas=db.cash.movements.filter(x=>x.type==='saida').reduce((a,x)=>a+x.value,0),saldo=db.cash.opening+entradas-saidas;content.innerHTML=`<div class="cards"><div class="card"><div class="muted">Abertura</div><div class="metric">${money(db.cash.opening)}</div></div><div class="card"><div class="muted">Entradas</div><div class="metric">${money(entradas)}</div></div><div class="card"><div class="muted">Saídas</div><div class="metric">${money(saidas)}</div></div><div class="card"><div class="muted">Saldo</div><div class="metric">${money(saldo)}</div></div></div><div class="card section"><div class="sectionhead"><b>Controle do caixa</b><div class="toolbar"><button class="btn secondary" onclick="abrirCaixa()">Abrir caixa</button><button class="btn secondary" onclick="lancamento()">+ Lançamento</button><button class="btn primary" onclick="fecharCaixa()">Fechar caixa / imprimir</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${db.cash.movements.map(x=>`<tr><td>${new Date(x.date).toLocaleString('pt-BR')}</td><td>${x.type}</td><td>${esc(x.desc)}</td><td>${money(x.value)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum movimento.</td></tr>'}</tbody></table></div></div>`}
function abrirCaixa(){let v=+prompt('Valor de abertura do caixa:',db.cash.opening)||0;db.cash.opening=v;db.cash.closed=false;save();go('caixa');toast('Caixa aberto!')}
function lancamento(){let t=prompt('Digite ENTRADA ou SAIDA:','SAIDA')?.toLowerCase(),v=+prompt('Valor:','0'),d=prompt('Descrição:','Despesa');if(!v)return;db.cash.movements.push({id:id(),type:t.startsWith('e')?'entrada':'saida',value:v,desc:d,date:new Date().toISOString()});save();go('caixa');toast('Lançamento registrado!')}
function fecharCaixa(){let entradas=db.cash.movements.filter(x=>x.type==='entrada').reduce((a,x)=>a+x.value,0),saidas=db.cash.movements.filter(x=>x.type==='saida').reduce((a,x)=>a+x.value,0),saldo=db.cash.opening+entradas-saidas;db.cash.closed=true;save();let w=window.open('','_blank');w.document.write(`<html><head><title>Fechamento de Caixa</title><style>body{font-family:Arial;padding:35px}h1{color:#7a3f26}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>Sapataria Pro</h1><h2>Fechamento do caixa</h2><p>${new Date().toLocaleString('pt-BR')}</p><table><tr><th>Abertura</th><td>${money(db.cash.opening)}</td></tr><tr><th>Entradas</th><td>${money(entradas)}</td></tr><tr><th>Saídas</th><td>${money(saidas)}</td></tr><tr><th>Saldo esperado</th><td>${money(saldo)}</td></tr></table><script>window.print()<\/script></body></html>`);w.document.close();toast('Fechamento gerado para impressão/PDF.')}
function relatorios(){let total=db.sales.reduce((a,x)=>a+x.total,0),serv=db.services.reduce((a,x)=>a+x.paid,0),stock=db.products.reduce((a,x)=>a+x.stock,0);content.innerHTML=`<div class="cards"><div class="card"><div class="muted">Total em vendas</div><div class="metric">${money(total)}</div></div><div class="card"><div class="muted">Recebido em serviços</div><div class="metric">${money(serv)}</div></div><div class="card"><div class="muted">Produtos em estoque</div><div class="metric">${stock}</div></div><div class="card"><div class="muted">Clientes</div><div class="metric">${db.customers.length}</div></div></div><div class="card section"><div class="sectionhead"><b>Exportação</b><div class="toolbar"><button class="btn primary" onclick="exportCSV('clientes')">Exportar clientes</button><button class="btn secondary" onclick="exportCSV('produtos')">Exportar produtos</button><button class="btn secondary" onclick="exportCSV('vendas')">Exportar vendas</button><button class="btn secondary" onclick="exportCSV('servicos')">Exportar serviços</button></div></div><p class="sub">Os arquivos CSV abrem normalmente no Excel.</p></div>`}
function exportCSV(type){let arr=db[type==='vendas'?'sales':type==='servicos'?'services':type];if(!arr?.length)return toast('Não há dados para exportar.');let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];let csv='\ufeff'+keys.join(';')+'\n'+arr.map(x=>keys.map(k=>`"${String(typeof x[k]==='object'?JSON.stringify(x[k]):x[k]??'').replace(/"/g,'""')}"`).join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='sapataria-'+type+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Arquivo exportado!')}
function config(){content.innerHTML=`<div class="card"><h3>Configurações da loja</h3><div class="formgrid"><div class="field"><label>Nome da loja</label><input id="cfg1" value="${esc(db.settings.shop)}"></div><div class="field"><label>Telefone</label><input id="cfg2" value="${esc(db.settings.phone)}"></div><div class="field full"><label>Endereço</label><input id="cfg3" value="${esc(db.settings.address)}"></div></div><button class="btn primary" onclick="saveConfig()">Salvar configurações</button><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><button class="btn danger" onclick="resetData()">Apagar dados locais</button><p class="muted">Esta versão salva os dados neste navegador. Para vários computadores e login real, conecte um banco de dados/Supabase.</p></div>`}
function saveConfig(){db.settings={shop:cfg1.value,phone:cfg2.value,address:cfg3.value};save();toast('Configurações salvas!')}
function resetData(){if(confirm('Isso apagará clientes, produtos, vendas e serviços deste navegador. Continuar?')){localStorage.removeItem(KEY);db=JSON.parse(JSON.stringify(seed));save();go('dashboard');toast('Dados apagados.')}}
function modal(title,body,ok){let m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="modalbox"><div class="sectionhead"><h3>${title}</h3><button class="btn secondary" onclick="closeModal()">✕</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary" id="modalOk">Salvar</button></div></div>`;document.body.appendChild(m);document.getElementById('modalOk').onclick=ok}function closeModal(){document.getElementById('modal')?.remove()}function logout(){localStorage.removeItem(AUTH);login()}if(localStorage.getItem(AUTH))app();else login();
</script></body></html>
